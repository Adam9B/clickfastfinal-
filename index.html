<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>ClickFast</title>
</head>

<body>
  <div id="main">
    <div id="container">
      <h1 class="flex-center">ClickFast</h1>
      <p class="catchphrase">
        Sois le plus rapide des clickers du game
      </p>
      <p id="timer" class="flex-center">temps restant : 5</p>
      <p id="score" class="flex-center" style="
  background-color: aquamarine;
  padding : 5px;
  margin :40px ;
  border: none;
  border-radius: 0.5rem;
  font-size: 1.5rem;
  font-weight: bold;
  ">0</p>
      <div class="flex-center">
        <button id="button-clicker">CLIQUE</button>
      </div>

      <div class="flex-center" style="margin: 50px;">
        <button id="buttonreset">RESET</button>
      </div>
    </div>
  </div>
</body>
<script src="script.js"></script>

</html>
